mode: standalone

# Bitnami moved the free MinIO images to its legacy registry in August 2025.
# These overrides keep the course-provided chart deployment reproducible.
global:
    security:
        allowInsecureImages: true

image:
    repository: bitnamilegacy/minio

console:
    image:
        repository: bitnamilegacy/minio-object-browser

clientImage:
    repository: bitnamilegacy/minio-client

defaultInitContainers:
    volumePermissions:
        image:
            repository: bitnamilegacy/os-shell

## Set default rootUser, rootPassword
## AccessKey and secretKey is generated when not set
## Distributed MinIO ref: https://min.io/docs/minio/linux/operations/install-deploy-manage/deploy-minio-multi-node-multi-drive.html
##
auth:
    rootUser: "rootuser"
    rootPassword: "rootpass123"

# Number of drives attached to a node
drivesPerNode: 1
# Number of MinIO containers running
replicas: 1
# Number of expanded MinIO clusters
pools: 1

## Enable persistence using Persistent Volume Claims
## ref: http://kubernetes.io/docs/user-guide/persistent-volumes/
##
persistence:
  enabled: false

## Configure resource requests and limits
## ref: http://kubernetes.io/docs/user-guide/compute-resources/
##
resources:
  requests:
    memory: 0.5Gi

##
provisioning:
    enabled: true
    buckets:
      - name: demucs-bucket
        policy: public
        purge: false
