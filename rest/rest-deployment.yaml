apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest-server
  template:
    metadata:
      labels:
        app: rest-server
    spec:
      containers:
        - name: rest-server
          image: demucs-rest:local
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: MINIO_HOST
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              value: rootuser
            - name: MINIO_SECRET_KEY
              value: rootpass123
            - name: MINIO_BUCKET
              value: demucs-bucket
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rest-server
spec:
  type: NodePort
  selector:
    app: rest-server
  ports:
    - port: 5000
      targetPort: 5000
